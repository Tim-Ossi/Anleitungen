  const v=id=>$(id).value;
  const c={
    y:parseInt(v("#e_y"),10), t:v("#e_t"), title:v("#e_title").trim(), setting:v("#e_setting").trim(), dur:v("#e_dur").trim(),
    pat:v("#e_pat").trim(), sit:v("#e_sit").trim(), tasks:lines(v("#e_tasks")), goals:lines(v("#e_goals")), hor:lines(v("#e_hor")),
    refl:lines(v("#e_refl")), src:lines(v("#e_src")), kb:[...document.querySelectorAll(".kbChk:checked")].map(x=>x.value)
  };
  if(!c.title||!c.pat||!c.sit||!c.tasks.length||!c.t){ toast("Bitte Titel, Themengebiet, Person, Fall und mindestens eine Aufgabe ausfüllen."); return; }
  const iss=anonymityIssues([c.pat,c.sit,c.title].join(" "));
  if(iss.length && !confirm("Möglicherweise nicht anonymisiert:\n– "+iss.join("\n– ")+"\n\nTrotzdem speichern?")) return;
  if(editingId){ const i=S.cards.findIndex(x=>x.id===editingId); S.cards[i]={...S.cards[i],...c}; }
  else { c.id=uid("u"); c.builtIn=false; S.cards.push(c); editingId=c.id; }
  save(); closeOv("#editOv"); renderAll(); toast("Lernkarte gespeichert."); openCard(editingId);
}

/* =========================================================
   Dialoge: Themen, Daten, Grundlagen, Lernende
   ========================================================= */
function openDlg(html){ $("#dlgSheet").innerHTML=html; $("#dlgOv").classList.add("open"); document.body.style.overflow="hidden"; }

function topicsDlg(){
  const rows=sortedTopics().map(t=>{const n=S.cards.filter(c=>c.t===t.id).length;
    return `<tr><td><input data-tname="${esc(t.id)}" value="${esc(t.name)}" style="width:100%;padding:.3rem;border:1px solid var(--line);border-radius:6px;background:var(--panel2)"></td><td><input data-tce="${esc(t.id)}" value="${esc(t.ce||"")}" style="width:110px;padding:.3rem;border:1px solid var(--line);border-radius:6px;background:var(--panel2)"></td><td>${n}</td><td>${n?"":`<button class="btn small danger" data-tdel="${esc(t.id)}">Löschen</button>`}</td></tr>`;}).join("");
  openDlg(`<div class="sheet-head"><div><h2>Themengebiete verwalten</h2><div style="color:var(--muted);font-size:.88rem">Alphabetische Sortierung erfolgt automatisch. Themen mit Karten können nicht gelöscht werden.</div></div><button class="btn x" data-close="#dlgOv">✕</button></div>
  <div class="sheet-body"><table class="info"><thead><tr><th>Name</th><th>CE</th><th>Karten</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <div class="row" style="margin-top:1rem;align-items:flex-end"><div class="fld"><label>Neues Themengebiet</label><input id="newTopic" placeholder="z. B. Schlaf und Ruhe"></div><div class="fld" style="flex:0 1 130px"><label>CE</label><input id="newTopicCe" placeholder="z. B. CE 02"></div><div class="fld" style="flex:0 0 auto"><button class="btn primary" id="addTopic">Hinzufügen</button></div></div></div>
  <div class="sheet-foot"><button class="btn primary" id="saveTopics">Speichern</button></div>`);
}

function dataDlg(){
  openDlg(`<div class="sheet-head"><div><h2>Daten sichern und übertragen</h2><div style="color:var(--muted);font-size:.88rem">Alle Daten liegen nur in diesem Browser auf diesem Gerät.</div></div><button class="btn x" data-close="#dlgOv">✕</button></div>
  <div class="sheet-body">
    <div class="sec"><h3>Export</h3><p>Sichert Karten, Themen, Lernende und Bearbeitungsstände als JSON-Datei – zum Backup oder zur Weitergabe an andere Geräte.</p>
      <div class="row"><button class="btn primary" id="expAll">Alles exportieren</button><button class="btn" id="expCards">Nur Karten und Themen exportieren</button></div></div>
    <div class="sec"><h3>Import</h3><p>Importierte Karten werden ergänzt; bei gleicher ID wird die Karte überschrieben. Bearbeitungsstände werden zusammengeführt.</p>
      <button class="btn" id="impBtn">JSON-Datei importieren …</button></div>
    <div class="sec"><h3>Lernende</h3><p>Aktuelle/r Lernende/r: <b>${esc((S.learners.find(l=>l.id===S.currentLearner)||{}).name||"")}</b></p>
      <div class="row"><button class="btn" id="renLearner">Umbenennen</button><button class="btn danger" id="delLearner">Lernende/n entfernen</button><button class="btn" id="resetProg">Bearbeitungsstände dieser Person zurücksetzen</button></div></div>
    <div class="sec"><h3>Einstellungen</h3>
      <label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" id="hideHor" ${S.settings.hideHorizon?"checked":""}> Erwartungshorizont für Lernende sperren (PIN der Praxisanleitung)</label>
      <div class="fld" style="max-width:240px;margin-top:.5rem"><label>PIN</label><input id="pinInp" type="password" value="${esc(S.settings.pin||"")}" placeholder="z. B. 4 Ziffern"><div class="hint">Einfacher Sichtschutz, kein Datenschutz-Verfahren.</div></div>
      <button class="btn" id="saveSettings">Einstellungen speichern</button></div>
    <div class="sec"><h3>Zurücksetzen</h3><button class="btn" id="restoreDefaults">Mitgelieferte Beispielkarten wiederherstellen</button> <button class="btn danger" id="wipeAll">Alle Daten löschen</button></div>
  </div>`);
}

function infoDlg(){
  const ce=[["CE 01","Ausbildungsstart – Pflegefachfrau/Pflegefachmann werden"],["CE 02","Zu pflegende Menschen in der Bewegung und Selbstversorgung unterstützen"],["CE 03","Erste Pflegeerfahrungen reflektieren – verständigungsorientiert kommunizieren"],["CE 04","Gesundheit fördern und präventiv handeln"],["CE 05","Menschen in kurativen Prozessen pflegerisch unterstützen und Patientensicherheit stärken"],["CE 06","In Akutsituationen sicher handeln"],["CE 07","Rehabilitatives Pflegehandeln im interprofessionellen Team"],["CE 08","Menschen in kritischen Lebenssituationen und in der letzten Lebensphase begleiten"],["CE 09","Menschen bei der Lebensgestaltung lebensweltorientiert unterstützen"],["CE 10","Entwicklung und Gesundheit in Kindheit und Jugend in pflegerischen Situationen fördern"],["CE 11","Menschen mit psychischen Gesundheitsproblemen und kognitiven Beeinträchtigungen personenzentriert unterstützen"]];
  openDlg(`<div class="sheet-head"><div><h2>Grundlagen der Lernkarten</h2></div><button class="btn x" data-close="#dlgOv">✕</button></div>
  <div class="sheet-body">
    <div class="sec"><h3>Rechtlicher Rahmen</h3><ul class="clean">
      <li><b>Pflegeberufegesetz (PflBG)</b> – § 5 Ausbildungsziel; § 4 Vorbehaltene Aufgaben, Pflegeprozessverantwortung (seit 01.01.2026 in der Fassung des Gesetzes zur Befugniserweiterung und Entbürokratisierung in der Pflege).</li>
      <li><b>Pflegeberufe-Ausbildungs- und -Prüfungsverordnung (PflAPrV)</b> – Praxisanleitung im Umfang von mindestens 10 % der praktischen Ausbildungszeit; Kompetenzen nach Anlage 1 (Zwischenprüfung) und Anlage 2 (Abschluss Pflegefachfrau/Pflegefachmann).</li>
      <li><b>${esc(RP)}</b> – Rahmenlehrplan mit elf curricularen Einheiten und Rahmenausbildungsplan; empfehlende Wirkung.</li></ul></div>
    <div class="sec"><h3>Curriculare Einheiten</h3><table class="info">${ce.map(r=>`<tr><td style="white-space:nowrap"><b>${r[0]}</b></td><td>${esc(r[1])}</td></tr>`).join("")}</table></div>
    <div class="sec"><h3>Kompetenzbereiche (Anlage 2 PflAPrV)</h3><ul class="clean">${Object.values(KB_LABEL).map(v=>`<li>${esc(v)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>Zuordnung zu Lehrjahren</h3><p>Die Rahmenpläne gliedern nach Ausbildungsdritteln (1./2. Drittel und 3. Drittel). Die Zuordnung der Karten zu Lehrjahren ist ein Vorschlag nach steigender Komplexität und kann im Editor an das schulinterne Curriculum und den Ausbildungsplan angepasst werden.</p></div>
    <div class="sec"><h3>Hinweise</h3><ul class="clean">
      <li>Alle Fallbeispiele sind fiktiv und anonymisiert (Initial, Alter). Ähnlichkeiten mit realen Personen sind zufällig.</li>
      <li>Die Inhalte ersetzen keine einrichtungsinternen Standards, Hygienepläne oder ärztlichen Anordnungen.</li>
      <li>Expertenstandards und Leitlinien werden regelmäßig aktualisiert – bitte vor dem Einsatz die gültige Fassung prüfen (DNQP, AWMF, RKI/KRINKO, GRC).</li></ul></div>
  </div>`);
}

/* =========================================================
   Export / Import
   ========================================================= */
function download(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function dateStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function doImport(data){
  if(!data||!Array.isArray(data.cards)){ toast("Ungültige Datei."); return; }
  (data.topics||[]).forEach(t=>{ if(t&&t.id&&!topicById(t.id)) S.topics.push({id:t.id,name:t.name,ce:t.ce||""}); });
  let n=0; data.cards.forEach(c=>{ if(!c||!c.id) return; const i=S.cards.findIndex(x=>x.id===c.id); if(i>=0) S.cards[i]=c; else S.cards.push(c); n++; });
  (data.learners||[]).forEach(l=>{ if(l&&l.id&&!S.learners.find(x=>x.id===l.id)) S.learners.push(l); });
  if(data.progress) Object.entries(data.progress).forEach(([lid,cards])=>{ S.progress[lid]=Object.assign(S.progress[lid]||{},cards); });
  save(); renderAll(); closeOv("#dlgOv"); toast(n+" Karten importiert.");
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("button, .card, [data-close]"); if(!el) return;
  if(el.dataset.close){ closeOv(el.dataset.close); if(el.dataset.close==="#detailOv") renderGrid(); return; }
  if(el.classList.contains("card")){ openCard(el.dataset.id); return; }
  if(el.dataset.y!==undefined && el.closest("#yearSeg")){ F.year=parseInt(el.dataset.y,10); document.querySelectorAll("#yearSeg button").forEach(b=>b.classList.toggle("on",b===el)); renderTopics(); renderGrid(); return; }
  if(el.dataset.topic!==undefined){ F.topic=el.dataset.topic; renderTopics(); renderGrid(); $("#aside").classList.remove("open"); return; }
  if(el.dataset.self){ const p=prog(currentCardId); p.self=el.dataset.self; touch(p); save(); renderDetail(); return; }
  if(el.dataset.tdel){ S.topics=S.topics.filter(t=>t.id!==el.dataset.tdel); if(F.topic===el.dataset.tdel) F.topic=""; save(); topicsDlg(); renderAll(); return; }
  switch(el.id){
    case "menuBtn": $("#aside").classList.toggle("open"); break;
    case "newCardBtn": openEditor(); break;
    case "topicsBtn": topicsDlg(); break;
    case "dataBtn": dataDlg(); break;
    case "infoBtn": infoDlg(); break;
    case "learnerAdd": { const n=prompt("Name oder Kürzel der/des Lernenden:"); if(n&&n.trim()){ const l={id:uid("l"),name:n.trim()}; S.learners.push(l); S.currentLearner=l.id; save(); renderAll(); } break; }
    case "showHor": {
      if(S.settings.hideHorizon && S.settings.pin){ const pin=prompt("PIN der Praxisanleitung:"); if(pin!==S.settings.pin){ toast("PIN nicht korrekt."); break; } }
      horizonOpen=true; renderDetail(); break; }
    case "printBtn": $("#detailOv").classList.add("print-target"); window.print(); setTimeout(()=>$("#detailOv").classList.remove("print-target"),500); break;
    case "dupBtn": openEditor(currentCardId,true); break;
    case "editBtn": openEditor(currentCardId); break;
    case "saveCard": saveCard(); break;
    case "delCard": if(confirm("Diese Lernkarte endgültig löschen?")){ S.cards=S.cards.filter(c=>c.id!==editingId); Object.values(S.progress).forEach(p=>delete p[editingId]); save(); closeOv("#editOv"); renderAll(); toast("Gelöscht."); } break;
    case "addTopic": { const n=$("#newTopic").value.trim(); if(!n) break; if(S.topics.some(t=>t.name.toLowerCase()===n.toLowerCase())){ toast("Thema existiert bereits."); break; } S.topics.push({id:uid("t"),name:n,ce:$("#newTopicCe").value.trim()}); save(); topicsDlg(); renderAll(); break; }
    case "saveTopics": document.querySelectorAll("[data-tname]").forEach(i=>{ const t=topicById(i.dataset.tname); if(t&&i.value.trim()) t.name=i.value.trim(); }); document.querySelectorAll("[data-tce]").forEach(i=>{ const t=topicById(i.dataset.tce); if(t) t.ce=i.value.trim(); }); save(); closeOv("#dlgOv"); renderAll(); toast("Themen gespeichert."); break;
    case "expAll": download(S,"pflege-lernkarten-backup-"+dateStr()+".json"); break;
    case "expCards": download({version:1,topics:S.topics,cards:S.cards},"pflege-lernkarten-karten-"+dateStr()+".json"); break;
    case "impBtn": $("#importFile").click(); break;
    case "renLearner": { const l=S.learners.find(x=>x.id===S.currentLearner); const n=prompt("Neuer Name:",l.name); if(n&&n.trim()){ l.name=n.trim(); save(); renderAll(); dataDlg(); } break; }
    case "delLearner": { if(S.learners.length<2){ toast("Mindestens eine Person muss bestehen bleiben."); break; } if(confirm("Diese Person und ihre Bearbeitungsstände entfernen?")){ delete S.progress[S.currentLearner]; S.learners=S.learners.filter(l=>l.id!==S.currentLearner); S.currentLearner=S.learners[0].id; save(); renderAll(); dataDlg(); } break; }
    case "resetProg": if(confirm("Alle Antworten und Status dieser Person zurücksetzen?")){ S.progress[S.currentLearner]={}; save(); renderAll(); toast("Zurückgesetzt."); } break;
    case "saveSettings": S.settings.hideHorizon=$("#hideHor").checked; S.settings.pin=$("#pinInp").value; save(); toast("Einstellungen gespeichert."); break;
    case "restoreDefaults": {
      DEFAULT_TOPICS.forEach(t=>{ if(!topicById(t.id)) S.topics.push(clone(t)); });
      DEFAULT_CARDS.forEach(c=>{ const i=S.cards.findIndex(x=>x.id===c.id); const nc={...clone(c),builtIn:true}; if(i>=0) S.cards[i]=nc; else S.cards.push(nc); });
      save(); renderAll(); toast("Beispielkarten wiederhergestellt."); break; }
    case "wipeAll": if(confirm("Wirklich ALLE Daten (Karten, Lernende, Antworten) löschen? Vorher exportieren!")){ S=freshState(); save(); F={year:0,topic:"",q:"",status:""}; closeOv("#dlgOv"); renderAll(); document.querySelectorAll("#yearSeg button").forEach((b,i)=>b.classList.toggle("on",i===0)); } break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="search"){ F.q=t.value; renderGrid(); return; }
  if(t.dataset && t.dataset.ans!==undefined){ const p=prog(currentCardId); p.answers[+t.dataset.ans]=t.value; touch(p); save(); return; }
  if(t.id==="fb"){ const p=prog(currentCardId); p.feedback=t.value; p.updated=new Date().toISOString(); save(); return; }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="learnerSel"){ S.currentLearner=t.value; save(); renderAll(); return; }
  if(t.id==="statusFilter"){ F.status=t.value; renderGrid(); return; }
  if(t.id==="statusSel"){ const p=prog(currentCardId); p.status=t.value; p.updated=new Date().toISOString(); save(); toast("Status: "+STATUS_LABEL[t.value]); return; }
  if(t.id==="importFile"){ const f=t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ doImport(JSON.parse(r.result)); }catch(err){ toast("Datei konnte nicht gelesen werden."); } t.value=""; }; r.readAsText(f); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ const open=[...document.querySelectorAll(".overlay.open")].pop(); if(open){ closeOv("#"+open.id); if(open.id==="detailOv") renderGrid(); } }
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("card")) openCard(e.target.dataset.id);
});
document.querySelectorAll(".overlay").forEach(ov=>ov.addEventListener("click",e=>{ if(e.target===ov){ closeOv("#"+ov.id); if(ov.id==="detailOv") renderGrid(); } }));

load(); renderAll();
</script>
</body>
</html>
